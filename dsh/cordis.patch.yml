# Machine-wide context and loop protection for all DSH profiles that expose
# these built-in rows. Profile-specific bundles may still add their own tools.
- id: agent-instructions
  disabled: false
  config:
    maxBytes: 12288
- id: skill-filesystem
  disabled: false
- id: tool-skill
  disabled: false
- id: compaction-basic
  disabled: false
  config:
    auto: true
    thresholdRatio: 0.72
    retainTokens: 32000
    maxTokens: 16384
    compactionRetries: 1
    maxOverflowRetries: 1
    modelPolicies:
      - provider: lmstudio
        model: ornith-1.5-9b
        thresholdRatio: 0.70
        retainTokens: 32000
        maxTokens: 8192
        compactionRetries: 1
        maxOverflowRetries: 1
      - provider: lmstudio
        model: qwen3.8-27b-gsq-rco
        thresholdRatio: 0.70
        retainTokens: 15625
        maxTokens: 4000
        compactionRetries: 1
        maxOverflowRetries: 1
- id: command-compact
  disabled: false
- id: tool-result-pruner
  disabled: false
  config:
    thresholdChars: 6000
    headChars: 3000
    tailChars: 1000
- id: repeat-tool-reminder
  config:
    thresholds: [3, 5]
    argumentsPreviewChars: 500
- insert:
    - id: qwen-request-defaults
      name: __DSH_HOME__/plugins/dsh-qwen-defaults/lib/index.js

# Explicit local robust defaults for every host loading context-guard.
- id: context-guard
  config:
    presetPolicies:
      local-robust-9b:
        maxTurnMs: null
        compactTokens: 91750
        contextWindow: 131072
        responseMaxTokens: 24576
        summaryMaxTokens: 8192
        summaryMinTokens: 1024
        safetyTokens: 4096
      local-robust-27b:
        maxTurnMs: null
        contextWindow: 64000
        responseMaxTokens: 12000
        summaryMaxTokens: 4000
        summaryMinTokens: 500
        safetyTokens: 2000
        economyTokens: 32000
        checkpointTokens: 40000
        compactTokens: 44800
        resultFingerprintChars: 3906
    economyTokens: 65536
    checkpointTokens: 81920
    compactTokens: 94371
    noProgressLimit: 3
    equivalentBlockLimit: 5
    maxTurnSteps: 48
    maxTurnToolCalls: 48
    maxTurnMs: 900000
    diagnosticMaxCalls: 3
    diagnosticMaxMs: 120000
    textSimilarity: 0.94
    resultFingerprintChars: 8000
