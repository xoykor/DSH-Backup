# Isolated robust-local host policy. This layer does not affect other profiles.
- id: context-guard
  config:
    presetPolicies:
      local-robust-9b:
        maxTurnSteps: null
        maxTurnToolCalls: null
        maxTurnMs: null
        compactTokens: 91750
        contextWindow: 131072
        responseMaxTokens: 24576
        summaryMaxTokens: 8192
        summaryMinTokens: 1024
        safetyTokens: 4096
      local-robust-27b:
        maxTurnSteps: null
        maxTurnToolCalls: null
        maxTurnMs: null
        contextWindow: 64000
        responseMaxTokens: 12000
        summaryMaxTokens: 4000
        summaryMinTokens: 500
        safetyTokens: 2000
        economyTokens: 32000
        checkpointTokens: 40000
        compactTokens: 44800
        resultFingerprintChars: 3906
    economyTokens: 65536
    checkpointTokens: 81920
    compactTokens: 94371
    noProgressLimit: 7
    equivalentBlockLimit: 5
    maxTurnSteps: 48
    maxTurnToolCalls: 48
    maxTurnMs: 900000
    diagnosticMaxCalls: 3
    diagnosticMaxMs: 120000
    textSimilarity: 0.94
    resultFingerprintChars: 8000

- id: compaction-basic
  config:
    maxTokens: 16384

- id: settings
  config:
    path: __DSH_HOME__/profiles/robust-local/settings.yaml

- id: web
  config:
    searchProvider: searxng

- id: goal
  disabled: true

- insert:
    - id: web-search-searxng
      name: __DSH_HOME__/plugins/dsh-web-search-searxng/index.mjs
      config:
        baseURL: http://127.0.0.1:8888

    - id: goal-verified
      name: __DSH_HOME__/plugins/dsh-goal-verification/lib/index.js
      config:
        defaultMaxGoalRounds: 48

    - id: verification
      name: __DSH_HOME__/plugins/dsh-verification/packages/dsh-verification/lib/index.js
      config:
        mode: enforce
        maxCapturedEvidence: 400
        maxCapturedBytes: 41943040
        completionPermitTtlMs: 60000
        binderFamilyFallback: true
        oracles:
          deterministic: true
          assistantResponse: true
          coverage:
            enabled: true
          proReview:
            enabled: false
            provider: spawn
            maxDefects: 20
        constraints: []
        intent:
          requireContractBeforeExecution: true
          contractOrigin: independent-capture
          freezeOnHumanConfirm: true
          consensusCount: 1
          provider: lmstudio
          model: ornith-1.5-9b
          readOnlyToolAllowlist:
            - read
            - read_file
            - list_dir
            - glob
            - grep
            - search
            - ask_user
            - ask_user_question
            - get_goal
            - get_verification_plan
            - web_search
          sourceBasis:
            includeAttachments: true
            includeControlDocs: true
            maxEntries: 400
        blobDir: __DSH_HOME__/profiles/robust-local/verification-blobs
        systemPromptSection: true

    # The host half lets dsh-client-modules discover and serve lib/client.js.
    - id: client-ui-verification
      name: __DSH_HOME__/plugins/dsh-verification/packages/dsh-client-ui-verification/lib/index.js

    # Browser automation control server (mirrors dsh-web-search-searxng).
    - id: tool-browser
      name: __DSH_HOME__/plugins/dsh-tool-browser/index.mjs
      config:
        baseURL: http://127.0.0.1:8731

    # dsh-plugin-guide: on-demand skill (plugin-dev toolkit knowledge base).
    - id: dsh-plugin-guide
      name: __DSH_HOME__/plugins/dsh-plugin-guide/index.js

    # dsh-test-drive v0.3.12: install/smoke test drive tool (/testdrive, drive_report).
    - id: test-drive
      name: __DSH_HOME__/plugins/dsh-test-drive/lib/index.js

    # dsh-score v0.2.11: multi-dimensional plugin quality scorer (/score, score_batch).
    - id: score
      name: __DSH_HOME__/plugins/dsh-score/lib/index.js

    # dsh-fast v0.2.12: read-only perf diagnostics (/fast, fast_report). Built from
    # src via tsdown; entry point loads with runtime @deepseek-ai/* deps resolved
    # from the shared runtime store (import smoke rc=0). Read-only; all tunables
    # default on. No service-id collision with context-guard.
    - id: dsh-fast
      name: __DSH_HOME__/plugins/dsh-fast/lib/index.js

    # dsh-budget v0.4.9: cost governance (/budget, Settings budget tab). Built via
    # tsdown; entry loads with runtime deps (import smoke rc=0). inject:[sessions].
    - id: dsh-budget
      name: __DSH_HOME__/plugins/dsh-budget/lib/index.js

    # dsh-output-styles v0.6.16: runtime output-style switch (/style, per-session).
    # Built from src via tsdown (fixed shipped config whose entries pointed at the
    # lib/ output paths); entry loads with @deepseek-ai/* deps resolved from the
    # shared runtime store (import smoke rc=0). inject:[systemPrompt, storageDomain].
    # System-prompt injection only; no service-id collision with context-guard.
    - id: output-styles
      name: __DSH_HOME__/plugins/dsh-output-styles/lib/index.js

    # dsh-translate v0.2.10: LLM translation (/translate, fix.mjs repair). Ships
    # prebuilt .mjs (main ./index.mjs); no build step. Prebuilt entry loads with
    # runtime @deepseek-ai/* deps resolved from the shared runtime store
    # (import smoke rc=0). inject:[commands, tools] — tool-only, no systemPrompt
    # injection; no service-id collision with context-guard.
    - id: dsh-translate
      name: __DSH_HOME__/plugins/dsh-translate/index.mjs

    # dsh-library v0.2.11: RAG library store (/library). Built from src via tsdown
    # (run from the plugin dir so its relative src/index.ts entry resolves; absolute
    # bin path fails with "No input files"). lib/index.js 255.56kB, zod inlined per
    # config. Import smoke LOADED_OK inject:[storageDomain, tools, commands] keys=60.
    # Host-only (no client bundle); storageDomain provided by the host stack. No
    # service-id collision with context-guard.
    - id: dsh-library

    # dsh-memento v0.5.12: frozen memory snapshot + recall tools (memory seam).
    # Prebuilt bundle (main ./index.mjs); no build step. Ships NO local node_modules;
    # 4 runtime @deepseek-ai/* imports (dsh-tools, schemastery, dsh-session,
    # dsh-settings) symlinked into a plugin-local node_modules so bare resolution
    # works like the other plugins (deps confirmed present in shared store). Import
    # smoke LOADED_OK inject:[tools, systemPrompt, approval]. Declares systemPrompt
    # injection but references no service-id collision with context-guard. No
    # dsh-auto-review / dsh-background-agents; host-only (no client bundle).
    - id: memento
      name: __DSH_HOME__/plugins/dsh-memento/index.mjs

    # dsh-checkpoint-rewind v0.6.11: checkpoint/rewind seam (/checkpoint, /rewind).
    # Prebuilt bundle (main ./index.mjs); no build step. Ships NO local node_modules;
    # 241 @deepseek-ai/* + top-level zod symlinked into a plugin-local node_modules
    # (@deepseek-ai -> shared store dir; zod from shared-store root). Import smoke
    # LOADED_OK inject:["sessions","commands"] (export const inject); runtime also
    # ctx.inject settings/sessionProjections/systemPrompt/tools. Manifest uses the
    # package-name form (name: dsh-checkpoint-rewind) but convention is bare-path, so
    # mounted via index.mjs. No reference to context-guard / auto-review /
    # background-agents -> safe bare mount. host-only (no client bundle).
    - id: checkpoint-rewind
      name: __DSH_HOME__/plugins/dsh-checkpoint-rewind/index.mjs

    # dsh-doublecheck v0.9.11: grill/guard double-check seam (confirm before act).
    # Manifest uses the package-name form (name: dsh-doublecheck) but convention is bare-path, so
    # mounted via lib/index.js. No reference to context-guard / auto-review / background-agents -> safe bare mount.
    - id: doublecheck
      name: __DSH_HOME__/plugins/dsh-doublecheck/lib/index.js
