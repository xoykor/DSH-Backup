agent-presets:
  default: local-robust-9b
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LMSTUDIO_API_KEY
      # LM Studio's Responses endpoint accepts the WebP data URLs emitted by
      # DSH, while its Chat Completions wrapper rejects image/webp.
      api: openai-responses
      baseURL: http://127.0.0.1:1234/v1
      defaultContextWindow: 85000
      # Local reasoning can remain silent while the model is thinking; give
      # the stream watchdog more time and leave room for the final answer.
      streamIdleTimeoutMs: 900000
      models:
        - id: qwen3.8-27b-gsq-rco
          input: [text, image]
          # Match the capacity actually loaded by LM Studio, not the model's
          # larger training-time context limit.
          contextWindow: 85000
          maxTokens: 65536
          # LM Studio's Responses endpoint accepts the OpenAI reasoning
          # levels through `xhigh`; `max` is a compatibility alias for it.
          reasoningEfforts:
            off: "none"
            minimal: "minimal"
            low: "low"
            medium: "medium"
            high: "high"
            xhigh: "xhigh"
            max: "xhigh"
agent-default-model:
  provider: lmstudio
  model: qwen3.8-27b-gsq-rco
  reasoningEffort: high
permission:
  defaultPreset: danger-full-access
