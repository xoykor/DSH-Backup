agent-presets:
  default: local-robust-9b
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LMSTUDIO_API_KEY
      # LM Studio's Responses endpoint accepts the WebP data URLs emitted by
      # DSH, while its Chat Completions wrapper rejects image/webp.
      api: openai-responses
      baseURL: http://127.0.0.1:1234/v1
      defaultContextWindow: 131072
      # Local reasoning can remain silent while the model is thinking; give
      # the stream watchdog more time and leave room for the final answer.
      streamIdleTimeoutMs: 900000
      models:
        - id: ornith-1.5-9b
          input: [text, image]
          # Match the capacity actually loaded by LM Studio, not the model's
          # larger training-time context limit.
          contextWindow: 131072
          maxTokens: 24576
          # Map DSH levels to the OpenAI Responses enum accepted by LM Studio
          # and to the low/medium/xhigh levels supported by Ornith's template.
          reasoningEfforts:
            off: "none"
            minimal: "low"
            low: "low"
            medium: "medium"
            high: "xhigh"
            xhigh: "xhigh"
            max: "xhigh"
        - id: qwen3.8-27b-gsq-rco
          name: Qwen 3.8 27B GSQ RCO
          contextWindow: 64000
          maxTokens: 12000
          input: [text, image]
          reasoningEfforts:
            off: "none"
            minimal: "minimal"
            low: "low"
            medium: "medium"
            high: "high"
            xhigh: "xhigh"
            max: "xhigh"
agent-default-model:
  provider: lmstudio
  model: ornith-1.5-9b
  reasoningEffort: high
permission:
  defaultPreset: danger-full-access
