agent-presets:
  default: local-robust-9b
llm-pi-ai:
  providers:
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LMSTUDIO_API_KEY
      # LM Studio's Responses endpoint accepts the WebP data URLs emitted by
      # DSH, while its Chat Completions wrapper rejects image/webp.
      api: openai-responses
      baseURL: http://127.0.0.1:1234/v1
      defaultContextWindow: 262144
      # Local reasoning can remain silent while the model is thinking; give
      # the stream watchdog more time and leave room for the final answer.
      streamIdleTimeoutMs: 900000
      models:
        - id: ornith-1.5-9b
          input: [text, image]
          # Match the capacity actually loaded by LM Studio, not the model's
          # larger training-time context limit.
          contextWindow: 262144
          maxTokens: 131072
          # Ornith exposes binary reasoning options through LM Studio.
          reasoningEfforts:
            off: "off"
            minimal: "on"
            low: "on"
            medium: "on"
            high: "on"
            xhigh: "on"
            max: "on"
agent-default-model:
  provider: lmstudio
  model: ornith-1.5-9b
  reasoningEffort: high
permission:
  defaultPreset: danger-full-access
