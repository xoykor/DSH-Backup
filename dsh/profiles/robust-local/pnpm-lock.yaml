        version: file:.dsh-artifacts/dsh-context-guard/1.0.0

packages:

  dsh-context-guard@file:.dsh-artifacts/dsh-context-guard/1.0.0:
    resolution: {directory: .dsh-artifacts/dsh-context-guard/1.0.0, type: directory}

snapshots:

  dsh-context-guard@file:.dsh-artifacts/dsh-context-guard/1.0.0: {}
