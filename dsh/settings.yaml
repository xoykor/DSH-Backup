ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: minimal
llm-deepseek:
  timeoutMs: 2147483647
  streamIdleTimeoutMs: 2147483647
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
llm-pi-ai:
  providers:
    google:
      apiKeyEnv: GOOGLE_API_KEY
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai/
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LMSTUDIO_API_KEY
      # LM Studio's Responses endpoint accepts the WebP data URLs emitted by
      # DSH, while its Chat Completions wrapper rejects image/webp.
      api: openai-responses
      baseURL: http://127.0.0.1:1234/v1
      # pi-ai resolves ornith's context window from here (entry has no explicit
      # contextWindow and the model is not in pi-ai's built-in catalog, so this
      # becomes request.defaultContextWindow at lib/index.js:671). It must match
      # LM Studio's UI value (262144) — a smaller number makes pi-ai flag silent
      # overflow (Case 2 of isContextOverflow) at ~50% of the real window, which
      # surfaces as CONTEXT_WINDOW_EXCEEDED on otherwise successful turns.
      defaultContextWindow: 262144
      # Unlimited timeout / connection watchdog for local reasoning
      timeoutMs: 2147483647
      streamIdleTimeoutMs: 2147483647
      models:
        - id: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
          name: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
          input:
            - text
            - image
          reasoningEfforts: false
        - id: granite-4.2-3b
          name: granite-4.2-3b
          reasoningEfforts:
            low: low
            high: high
        - id: swift-1.5-qwen3.8-27b-gsq-rco
          name: swift-1.5-qwen3.8-27b-gsq-rco
agent-default-model:
  provider: lmstudio
  model: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
permission:
  defaultPreset: danger-full-access
dsh-context-guard:
  presets:
    local-robust-9b:
      contextWindow: 262144
      economyRatio: 0.5
      checkpointRatio: 0.625
      compactRatio: 0.699
      responseRatio: 0.1875
      summaryRatio: 0.08250000000000005
      summaryMinRatio: 0.022
      safetyRatio: 0.021
      retainRatio: 0.245
