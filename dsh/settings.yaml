ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
agent-presets:
  default: minimal
llm-deepseek:
  timeoutMs: 2147483647
  streamIdleTimeoutMs: 2147483647
  models:
    - id: deepseek-v4-flash
      name: DeepSeek-V4-Flash
      contextWindow: 1000000
    - id: deepseek-v4-pro
      name: DeepSeek-V4-Pro
      contextWindow: 1000000
llm-pi-ai:
  providers:
    google:
      apiKeyEnv: GOOGLE_API_KEY
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai/
    lmstudio:
      displayName: LM Studio
      apiKeyEnv: LMSTUDIO_API_KEY
      # LM Studio's Responses endpoint accepts the WebP data URLs emitted by
      # DSH, while its Chat Completions wrapper rejects image/webp.
      api: openai-responses
      baseURL: http://127.0.0.1:1234/v1
      # Raised to the model's own cap (ornith). The backend's real window is
      # still controlled by LM Studio; this only sets DSH's assumed size.
      defaultContextWindow: 131072
      # Unlimited timeout / connection watchdog for local reasoning
      timeoutMs: 2147483647
      streamIdleTimeoutMs: 2147483647
      models:
        - id: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
          name: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
          input:
            - text
            - image
          # This model's LM Studio chat template has no reasoning_effort input;
          # it always starts a thinking block unless LM Studio changes its template.
          reasoningEfforts: false
        - id: qwen3.8-27b-gsq-rco
          name: qwen3.8-27b-gsq-rco
          # Its template accepts exactly low, medium, and xhigh. Expose the
          # familiar UI level "high" while sending the template's xhigh value.
          reasoningEfforts:
            low: low
            medium: medium
            high: xhigh
        - id: granite-4.2-3b
          name: granite-4.2-3b
          # Granite's LM Studio template toggles between low and full reasoning.
          reasoningEfforts:
            low: low
            high: high
agent-default-model:
  provider: lmstudio
  model: ornith-1.5-9b-dsh-agentic-gpt-5.6-sol-distill
permission:
  defaultPreset: danger-full-access
dsh-context-guard:
  presets:
    local-robust-9b:
      contextWindow: 131072
      economyRatio: 0.5
      checkpointRatio: 0.625
      compactRatio: 0.7715
      responseRatio: 0.1875
      summaryRatio: 0.01
      summaryMinRatio: 0.001
      safetyRatio: 0.021
      retainRatio: 0.245
