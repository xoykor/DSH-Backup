schemaVersion: 1
dshPackage: "@deepseek-ai/dsh"
dshVersion: "0.1.5-rc.2"
nodeRequirement: ">=22"
pnpmVersion: "11.26.0"
runtimeLockfile: "runtime/package-lock.json"
installPrefix: "~/.local"
dshHome: "~/.dsh"
codexHome: "~/.codex"

